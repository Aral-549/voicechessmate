<!doctype html>
<meta charset="utf-8">
<title>VoiceChessmate audio diagnostic</title>
<style>
  body { font: 15px/1.6 system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; background:#111; color:#eee; }
  button { font: inherit; padding: 10px 18px; margin: 4px 6px 4px 0; border-radius: 8px; border: 1px solid #444; background:#222; color:#eee; cursor:pointer; }
  button:hover { background:#333; }
  pre { background:#000; border:1px solid #333; padding: 12px; border-radius:8px; white-space: pre-wrap; }
  h2 { font-size: 15px; margin: 24px 0 6px; color:#8f8; }
  .bad { color:#f77; } .good { color:#7f7; }
</style>

<h1>Audio diagnostic</h1>
<p>Click each button in order and report what you see and hear.</p>

<h2>1. Web Audio beep (needs NO speech engine)</h2>
<button id="beep">Play beep</button>
<span id="beepresult"></span>

<h2>2. Speech synthesis</h2>
<button id="speak">Speak "Knight to Felix three"</button>
<button id="refresh">Re-list voices</button>

<h2>Log</h2>
<pre id="log"></pre>

<script>
const logEl = document.getElementById('log');
function log(msg, cls) {
  const line = document.createElement('span');
  if (cls) line.className = cls;
  line.textContent = msg + '\n';
  logEl.appendChild(line);
}

// --- 1. Web Audio ---
document.getElementById('beep').onclick = async () => {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    if (ctx.state === 'suspended') await ctx.resume();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 440;
    gain.gain.setValueAtTime(0.25, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(); osc.stop(ctx.currentTime + 0.4);
    log('BEEP: AudioContext state=' + ctx.state + ', sampleRate=' + ctx.sampleRate + ' — did you HEAR it?', 'good');
  } catch (e) {
    log('BEEP FAILED: ' + e, 'bad');
  }
};

// --- 2. Speech synthesis ---
function listVoices() {
  if (!('speechSynthesis' in window)) { log('speechSynthesis: NOT SUPPORTED', 'bad'); return []; }
  const v = speechSynthesis.getVoices() || [];
  log('VOICES: ' + v.length + ' found' + (v.length === 0 ? '  <-- THIS IS THE PROBLEM' : ''), v.length ? 'good' : 'bad');
  v.slice(0, 8).forEach(x => log('   - ' + x.name + '  [' + x.lang + ']' + (x.localService ? ' local' : ' remote')));
  if (v.length > 8) log('   ... and ' + (v.length - 8) + ' more');
  return v;
}

document.getElementById('refresh').onclick = listVoices;
speechSynthesis.addEventListener('voiceschanged', () => { log('event: voiceschanged fired'); listVoices(); });

document.getElementById('speak').onclick = () => {
  const v = listVoices();
  const u = new SpeechSynthesisUtterance('Knight to Felix three');
  const en = v.find(x => x.lang && x.lang.toLowerCase().startsWith('en'));
  if (en) { u.voice = en; log('using voice: ' + en.name); }
  else log('no English voice to assign', 'bad');

  u.onstart = () => log('event: onstart  <-- engine accepted it', 'good');
  u.onend   = () => log('event: onend', 'good');
  u.onerror = (e) => log('event: onerror  error=' + e.error, 'bad');

  speechSynthesis.speak(u);
  log('called speak(). speaking=' + speechSynthesis.speaking + ' pending=' + speechSynthesis.pending);
  setTimeout(() => {
    log('after 2s: speaking=' + speechSynthesis.speaking + ' pending=' + speechSynthesis.pending);
    log('If NO onstart/onerror fired above, the browser has no working TTS backend.',
        'bad');
  }, 2000);
};

log('userAgent: ' + navigator.userAgent);
log('---');
listVoices();
</script>
