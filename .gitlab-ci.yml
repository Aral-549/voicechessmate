image: node:22

cache:
  key: ${CI_COMMIT_REF_SLUG}
  paths:
    - .npm/
    - node_modules/

before_script:
  - npm ci --cache .npm --prefer-offline

stages:
  - test
  - build

test:
  stage: test
  script:
    - npx tsc --noEmit
    - npx vitest run

build:
  stage: build
  script:
    - npm run build
